<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Finder</title>
</head>
<body>

<h2>Find Day Name</h2>

<script>
    // Take input from the user
    let day = parseInt(prompt("Enter a number between 1 and 7:"));

    // Check the day using switch
    switch(day) {
        case 1:
            document.write("Day 1: Monday");
            console.log("Day 1: Monday");
            break;

        case 2:
            document.write("Day 2: Tuesday");
            console.log("Day 2: Tuesday");
            break;

        case 3:
            document.write("Day 3: Wednesday");
            console.log("Day 3: Wednesday");
            break;

        case 4:
            document.write("Day 4: Thursday");
            console.log("Day 4: Thursday");
            break;

        case 5:
            document.write("Day 5: Friday");
            console.log("Day 5: Friday");
            break;

        case 6:
            document.write("Day 6: Saturday");
            console.log("Day 6: Saturday");
            break;

        case 7:
            document.write("Day 7: Sunday");
            console.log("Day 7: Sunday");
            break;

        default:
            document.write("Invalid input! Please enter a number between 1 and 7.");
            console.log("Invalid input! Please enter a number between 1 and 7.");
    }
</script>

</body>
</html>
