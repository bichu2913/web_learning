<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Program</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }
        h1 {
            color: darkblue;
        }
        .output {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px gray;
        }
        p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

<h1>Student Details Report</h1>

<div class="output" id="output"></div>

<script>
    const output = document.getElementById("output");

    function display(text) {
        console.log(text);
        output.innerHTML += `<p>${text}</p>`;
    }

    
    // 1. Variables
   

    let studentName = "John";
    let age = 20;
    let course = "JavaScript";
    let totalMarks = 240;
    let attendancePercentage = 85;
    let isFeePaid = true;
    let phoneNumber = "9876543210";
    let address = null;
    let email;
    let bonusMarks = 15;
    let attemptCount = 1;

  
    // 2. Display Variables & Types
    

    display("<b>VARIABLE VALUES AND DATA TYPES</b>");

    display(`Student Name: ${studentName} | Type: ${typeof studentName}`);
    display(`Age: ${age} | Type: ${typeof age}`);
    display(`Course: ${course} | Type: ${typeof course}`);
    display(`Total Marks: ${totalMarks} | Type: ${typeof totalMarks}`);
    display(`Attendance Percentage: ${attendancePercentage} | Type: ${typeof attendancePercentage}`);
    display(`Is Fee Paid: ${isFeePaid} | Type: ${typeof isFeePaid}`);
    display(`Phone Number: ${phoneNumber} | Type: ${typeof phoneNumber}`);
    display(`Address: ${address} | Type: ${typeof address}`);
    display(`Email: ${email} | Type: ${typeof email}`);
    display(`Bonus Marks: ${bonusMarks} | Type: ${typeof bonusMarks}`);
    display(`Attempt Count: ${attemptCount} | Type: ${typeof attemptCount}`);

    
    // 3. Calculations
    

    display("<hr><b>CALCULATIONS</b>");

    totalMarks += bonusMarks;
    display(`Updated Total Marks: ${totalMarks}`);

    let averageMarks = totalMarks / 5;
    display(`Average Marks: ${averageMarks}`);

    let remainder = totalMarks % 5;
    display(`Remainder (Total Marks % 5): ${remainder}`);

    let ageSquare = age ** 2;
    display(`Square of Age: ${ageSquare}`);

    
    // 4. Assignment Operators
    

    display("<hr><b>ASSIGNMENT OPERATORS</b>");

    totalMarks += 20;
    display(`After +=20 : ${totalMarks}`);

    attendancePercentage -= 5;
    display(`After -=5 : ${attendancePercentage}`);

    bonusMarks *= 2;
    display(`After *=2 : ${bonusMarks}`);

    totalMarks /= 2;
    display(`After /=2 : ${totalMarks}`);

    totalMarks %= 7;
    display(`After %=7 : ${totalMarks}`);

    
    // 5. Relational Operators
    

    display("<hr><b>RELATIONAL OPERATORS</b>");

    display(`Age >= 18 : ${age >= 18}`);
    display(`Total Marks > 250 : ${totalMarks > 250}`);
    display(`Attendance < 75 : ${attendancePercentage < 75}`);
    display(`Course == "JavaScript" : ${course == "JavaScript"}`);
    display(`Course === "JavaScript" : ${course === "JavaScript"}`);
    display(`Student Name != "Admin" : ${studentName != "Admin"}`);
    display(`Student Name !== "Admin" : ${studentName !== "Admin"}`);
    display(`Age < 25 : ${age < 25}`);
    display(`Attendance <= 100 : ${attendancePercentage <= 100}`);

   
    // 6. Logical Operators
   

    display("<hr><b>LOGICAL OPERATORS</b>");

    let examEligible =
        attendancePercentage >= 75 && isFeePaid;

    display(`Eligible for Exam: ${examEligible}`);

    let certificateEligible =
        totalMarks >= 250 || attendancePercentage >= 90;

    display(`Eligible for Certificate: ${certificateEligible}`);

    display(`Opposite of Fee Paid: ${!isFeePaid}`);

    
    // 7. Increment & Decrement
    

    display("<hr><b>INCREMENT & DECREMENT</b>");

    attemptCount++;
    display(`After Increment: ${attemptCount}`);

    attemptCount--;
    display(`After Decrement: ${attemptCount}`);

    
    // 8. Ternary Operator
    

    display("<hr><b>TERNARY OPERATOR</b>");

    let result = averageMarks >= 50 ? "Pass" : "Fail";
    display(`Result: ${result}`);

    let category = age >= 18 ? "Adult" : "Minor";
    display(`Category: ${category}`);

   
    // 9. Final Output
   

    display("<hr><b>FINAL OUTPUT</b>");

    display(`Student Name : ${studentName}`);
    display(`Age : ${age}`);
    display(`Course : ${course}`);
    display(`Final Total Marks : ${totalMarks}`);
    display(`Average Marks : ${averageMarks}`);
    display(`Attendance : ${attendancePercentage}`);
    display(`Fee Paid : ${isFeePaid}`);
    display(`Phone Number : ${phoneNumber}`);
    display(`Address : ${address}`);
    display(`Email : ${email}`);
    display(`Bonus Marks : ${bonusMarks}`);
    display(`Attempt Count : ${attemptCount}`);
    display(`Exam Eligible : ${examEligible}`);
    display(`Certificate Eligible : ${certificateEligible}`);
    display(`Result : ${result}`);
    display(`Category : ${category}`);

</script>

</body>
</html>
