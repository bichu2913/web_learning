<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS vs Bootstrap vs Tailwind</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    *{
       
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:#f4f4f4;
        padding:40px;
    }

    .container{
        display:flex;
        justify-content:center;
        gap:30px;
        flex-wrap:wrap;
    }

    /* ---------- Pure CSS Card ---------- */

 .css-card{
    width:300px;
    background:#fff;
    border-radius:20px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.css-card i{
    font-size:90px;
    color:#0d6efd;
}

.css-card h1{
    font-size:34px;
    font-weight:700;
    margin:15px 0 8px;
}

.css-card p{
    font-size:18px;
    color:#666;
    margin-bottom:35px;
}

.css-card button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:50px;
    background:#0d6efd;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

    <!-- ================= Pure CSS ================= -->

<div class="css-card">
    <i class="bi bi-person-circle"></i>

    <h1>John Doe</h1>
    <p>Frontend Developer</p>

    <button>View Profile</button>
</div> 

    <!-- ================= Bootstrap ================= -->

<div class="card shadow-lg rounded-4 text-center p-4" style="width:300px;">
    <i class="bi bi-person-circle text-primary" style="font-size:90px;"></i>

    <h1 class="fw-bold display-6 mt-3">John Doe</h1>

    <p class="text-secondary fs-5 mb-4">
        Frontend Developer
    </p>

    <button class="btn btn-primary rounded-pill w-100 py-3 fs-5">
        View Profile
    </button>
</div> 

    <!-- ================= Tailwind ================= -->
<div class="w-[300px] bg-white rounded-[20px] shadow-xl p-8 text-center">

    <i class="bi bi-person-circle text-blue-600 text-[90px]"></i>

    <h1 class="text-4xl font-bold mt-3">
        John Doe
    </h1>

    <p class="text-gray-500 text-lg mt-2 mb-8">
        Frontend Developer
    </p>

    <button class="w-full bg-blue-600 text-white py-3 rounded-full text-xl hover:bg-blue-700">
        View Profile
    </button> 
 
</div>

</div>

<script>

   src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

</script>

</body>
</html>
